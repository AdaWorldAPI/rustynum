name: Rust CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  # qualia-xor excluded: missing candle/tokenizers deps (not wired yet).
  # NOTE: Cargo package name uses hyphen, not underscore.
  EXCLUDED: "--exclude qualia-xor"

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel; just ensure components are present.
      - name: Install Rust toolchain with components
        run: |
          rustup show
          rustup component add rustfmt clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-lint-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (workspace, excluding qualia_xor)
        run: cargo clippy --workspace ${{ env.EXCLUDED }} --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel; rustup show triggers install.
      - name: Install Rust toolchain
        run: rustup show

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-

      - name: cargo test (workspace)
        run: |
          EXCLUDES="${{ env.EXCLUDED }}"
          # rustynum-rs, rustynum-arrow, and python bindings use AVX-512 types
          # from simd_avx512 throughout their public API. They are x86_64-only
          # until the ISA trait migration is complete.
          if [ "$(uname -m)" != "x86_64" ]; then
            EXCLUDES="$EXCLUDES --exclude rustynum-rs --exclude rustynum-arrow --exclude rustynum"
          fi
          cargo test --workspace $EXCLUDES
