[package]
name = "rustymkl"
version = "0.1.0"
edition = "2021"
description = "Pure Rust MKL replacement — LAPACK, FFT, VML with AVX-512/AVX2 SIMD"

[features]
default = []
avx512 = []
avx2 = []
mkl = ["rustynum-core/mkl", "rustyblas/mkl"]

[dependencies]
rustynum-core = { path = "../rustynum-core" }
rustyblas = { path = "../rustyblas" }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "mkl_benchmarks"
harness = false
