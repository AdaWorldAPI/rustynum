[package]
name = "rustyblas"
version = "0.1.0"
edition = "2021"
description = "Pure Rust BLAS implementation with AVX-512/AVX2 SIMD — drop-in OpenBLAS replacement"

[features]
default = []
avx512 = []
avx2 = []
mkl = ["rustynum-core/mkl"]

[dependencies]
rustynum-core = { path = "../rustynum-core" }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "blas_benchmarks"
harness = false
